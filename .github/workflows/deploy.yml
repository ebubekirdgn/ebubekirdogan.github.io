name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages (manual git push)
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -xeuo pipefail
          echo "REPO=${REPO}"
          echo "Checking git and rsync versions"
          git --version || true
          rsync --version || true

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking if remote gh-pages exists"
          if git ls-remote --exit-code --heads https://x-access-token:${TOKEN}@github.com/${REPO} gh-pages; then
            echo "gh-pages exists — cloning"
            git clone --depth=1 --branch=gh-pages https://x-access-token:${TOKEN}@github.com/${REPO} gh-pages-out
          else
            echo "gh-pages does not exist — preparing new orphan branch"
            mkdir -p gh-pages-out
            pushd gh-pages-out
            git init
            git checkout --orphan gh-pages || true
            popd
          fi

          echo "Syncing files (excluding .git and workflows)"
          rsync -av --delete --exclude='.git' --exclude='.github' --exclude='node_modules' ./ gh-pages-out/

          pushd gh-pages-out
          git add --all
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            exit 0
          fi

          git commit -m "chore(deploy): update gh-pages [skip ci]" || echo "commit failed or nothing to commit"
          echo "Pushing to gh-pages"
          git push https://x-access-token:${TOKEN}@github.com/${REPO} gh-pages --force
          popd
